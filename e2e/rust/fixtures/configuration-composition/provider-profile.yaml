id: composition-provider
display_name: Composition acceptance fixture
category: other
credentials:
  - name: token
    env_vars: [COMPOSITION_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: composition.invalid
    port: 18443
    protocol: rest
    access: full
binaries:
  - path: /usr/bin/python*
  - path: /usr/local/bin/python*
  - path: /sandbox/.uv/python/*/bin/python*
